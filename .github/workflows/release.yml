name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<< "$latest"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          if [ "$latest" = "0.0.0" ]; then major=1; minor=0; patch=0; fi
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Package addon
        run: |
          mkdir -p dist/yunaui
          git archive HEAD | tar -x -C dist/yunaui
          rm -rf dist/yunaui/.github dist/yunaui/.gitignore
          sed -i "s/^addon.version *= *'[^']*';/addon.version = '${{ steps.version.outputs.version }}';/" dist/yunaui/yunaui.lua
          (cd dist && zip -qr "yunaui-${{ steps.version.outputs.version }}.zip" yunaui)

      - name: Package .vcaddon (VanaCore launcher / ffxiprivateservers.com)
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          src = open('dist/yunaui/yunaui.lua', encoding='utf-8').read()
          m = re.search(r"^addon\.desc\s*=\s*'((?:[^'\\]|\\.)*)'", src, re.M)
          desc = m.group(1).replace("\\'", "'") if m else ''
          info = {"format": 1, "name": "yunaui", "version": v, "title": "YunaUI", "author": "Yunas",
                  "description": desc, "homepage": "https://github.com/YunasXI/yunaui"}
          open('dist/addon.json', 'w', encoding='utf-8').write(json.dumps(info, ensure_ascii=False, indent=2) + '\n')
          PY
          cat dist/addon.json
          (cd dist && zip -qr "yunaui-${{ steps.version.outputs.version }}.vcaddon" addon.json yunaui)

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          prev="${{ steps.version.outputs.previous }}"
          if [ "$prev" != "0.0.0" ]; then notes=$(git log --no-merges --format='- %s' "$prev"..HEAD); fi
          notes=${notes:-"- First official release"}
          gh release create "$v" "dist/yunaui-$v.zip" "dist/yunaui-$v.vcaddon" --title "v$v" --target "$GITHUB_SHA" --notes "$notes"
